<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A & N — Engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy: #4a1226;
    --burgundy-deep: #2f0a18;
    --rose: #b04a63;
    --blush: #f2d7dd;
    --blush-pale: #faf1ee;
    --gold: #c9a15a;
    --gold-soft: #e3caa0;
    --ivory: #fdf8f4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Jost', sans-serif;
    background: var(--burgundy-deep);
    color: var(--ivory);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- Ambient background ---------- */
  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 6vw 8vh;
    background:
      radial-gradient(ellipse 60% 45% at 22% 15%, rgba(224,138,163,0.30), transparent 60%),
      radial-gradient(ellipse 55% 50% at 82% 10%, rgba(176,74,99,0.38), transparent 62%),
      radial-gradient(ellipse 70% 55% at 50% 100%, rgba(201,161,90,0.20), transparent 65%),
      radial-gradient(ellipse 90% 70% at 50% 45%, rgba(122,32,58,0.55), transparent 70%),
      linear-gradient(160deg, #611830 0%, var(--burgundy) 30%, var(--burgundy-deep) 62%, #200712 100%);
    background-size: 140% 140%;
    animation: drift 22s ease-in-out infinite alternate;
    text-align:center;
    isolation:isolate;
  }

  @keyframes drift{
    0%{ background-position: 0% 0%, 100% 0%, 50% 100%, 50% 40%, 0% 0%; }
    100%{ background-position: 10% 10%, 90% 15%, 45% 100%, 55% 55%, 0% 0%; }
  }

  .scene::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(242,215,221,0.55), transparent),
      radial-gradient(1.5px 1.5px at 75% 20%, rgba(242,215,221,0.45), transparent),
      radial-gradient(2px 2px at 60% 70%, rgba(201,161,90,0.55), transparent),
      radial-gradient(1.5px 1.5px at 40% 85%, rgba(242,215,221,0.4), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(242,215,221,0.35), transparent),
      radial-gradient(2px 2px at 10% 65%, rgba(201,161,90,0.45), transparent),
      radial-gradient(1.5px 1.5px at 30% 50%, rgba(242,215,221,0.3), transparent),
      radial-gradient(1.5px 1.5px at 68% 42%, rgba(201,161,90,0.35), transparent);
    pointer-events:none;
    opacity:0.85;
    z-index:0;
  }

  .glow{
    position:absolute;
    top:50%; left:50%;
    width:min(60vw, 620px);
    height:min(60vw, 620px);
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(226,158,178,0.28) 0%, rgba(176,74,99,0.12) 45%, transparent 72%);
    filter: blur(6px);
    animation: pulse-glow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes pulse-glow{
    0%,100%{ opacity:0.7; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); }
  }

  .petals{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  .petal{
    position:absolute;
    bottom:-40px;
    width:10px; height:14px;
    border-radius: 60% 0 60% 0;
    background: linear-gradient(135deg, var(--blush), var(--rose));
    opacity:0.55;
    animation: float-up linear infinite;
  }

  .petal.gold{ background: linear-gradient(135deg, var(--gold-soft), var(--gold)); }

  @keyframes float-up{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    50%{ transform: translateY(-52vh) translateX(18px) rotate(180deg); }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-104vh) translateX(-14px) rotate(360deg); opacity:0; }
  }

  .scene > *:not(.petals):not(.glow){
    position:relative;
    z-index:1;
  }

  /* ---------- Frame border ---------- */
  .frame{
    position:fixed; inset:14px;
    border:1px solid rgba(201,161,90,0.35);
    pointer-events:none;
    z-index:50;
  }
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    border-color: var(--gold);
    border-style:solid;
  }
  .corner-tl{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .corner-br{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  /* ---------- Eyebrow ---------- */
  .eyebrow{
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform:uppercase;
    color: var(--gold-soft);
    margin-bottom: 2.2rem;
    opacity:0;
    animation: rise 1s ease forwards 0.15s;
  }

  /* ---------- Monogram ---------- */
  .monogram-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(1rem, 4vw, 2.4rem);
    margin-bottom: 1.6rem;
    opacity:0;
    animation: rise 1.1s ease forwards 0.35s;
  }

  .initial{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(3.6rem, 12vw, 7.5rem);
    line-height:1;
    color: var(--ivory);
    position:relative;
  }

  .ampersand{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--gold);
    transform: translateY(-6px);
  }

  .names{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:italic;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    letter-spacing:0.04em;
    color: var(--blush);
    margin-bottom: 2.6rem;
    opacity:0;
    animation: rise 1.1s ease forwards 0.55s;
  }

  .rule{
    width:1px;
    height:44px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    margin: 0 auto 2.6rem;
    opacity:0;
    animation: rise 1s ease forwards 0.7s;
  }

  .headline{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size: clamp(1.5rem, 3.4vw, 2.3rem);
    line-height:1.35;
    max-width: 32ch;
    color: var(--ivory);
    margin-bottom: 3.4rem;
    opacity:0;
    animation: rise 1.1s ease forwards 0.85s;
  }
  .headline em{ font-style:italic; color: var(--gold-soft); }

  /* ---------- Countdown ---------- */
  .countdown{
    display:flex;
    gap: clamp(0.6rem, 3vw, 2.2rem);
    justify-content:center;
    align-items:flex-start;
    margin-bottom: 3.2rem;
    opacity:0;
    animation: rise 1.1s ease forwards 1.05s;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width: 4.4rem;
  }

  .unit-value{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height:1;
    color: var(--ivory);
    font-variant-numeric: tabular-nums;
    position:relative;
    padding-bottom: 0.6rem;
  }

  .unit-value::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:28px; height:1px;
    background: var(--gold);
    opacity:0.6;
  }

  .unit-label{
    margin-top: 0.9rem;
    font-size: 0.62rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color: var(--blush);
    opacity:0.75;
  }

  .colon{
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--gold);
    opacity:0.5;
    padding-top: 0.2rem;
    align-self:flex-start;
  }

  /* ---------- Date line ---------- */
  .date-line{
    display:flex;
    align-items:center;
    gap:1rem;
    justify-content:center;
    opacity:0;
    animation: rise 1.1s ease forwards 1.25s;
  }

  .date-line .dash{
    width:34px; height:1px;
    background: rgba(201,161,90,0.5);
  }

  .date-text{
    font-size: 0.78rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--gold-soft);
  }

  .sub-date{
    margin-top: 0.8rem;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: 1.05rem;
    color: var(--blush);
    opacity: 0.85;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* Arrived state */
  .arrived{
    display:none;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--gold);
  }

  footer{
    position:relative;
    text-align:center;
    padding: 2.4rem 1rem 2.6rem;
    font-size: 0.66rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: rgba(242,215,221,0.45);
    background: var(--burgundy-deep);
  }

  @media (max-width: 480px){
    .countdown{ gap: 0.5rem; }
    .unit{ min-width: 3.6rem; }
    .colon{ padding-top: 0.1rem; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
</div>

<div class="scene">
  <div class="glow"></div>
  <div class="petals" id="petals"></div>

  <div class="eyebrow">Together with their families</div>

  <div class="monogram-wrap">
    <span class="initial">A</span>
    <span class="ampersand">&amp;</span>
    <span class="initial">N</span>
  </div>

  <p class="names">Abdelrhman &nbsp;&middot;&nbsp; Nareman</p>

  <div class="rule"></div>

  <p class="headline">Two hearts, one promise —<br>this is where we <em>begin our forever</em>.</p>

  <div id="countdown-active">
    <div class="countdown" id="countdown">
      <div class="unit"><div class="unit-value" id="days">00</div><div class="unit-label">Days</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="unit-value" id="hours">00</div><div class="unit-label">Hours</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="unit-value" id="minutes">00</div><div class="unit-label">Minutes</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="unit-value" id="seconds">00</div><div class="unit-label">Seconds</div></div>
    </div>
  </div>

  <p class="arrived" id="arrived-message">Today, our story continues.</p>

  <div class="date-line">
    <span class="dash"></span>
    <span class="date-text">5th of November</span>
    <span class="dash"></span>
  </div>
  <p class="sub-date">A love that found its way home — come celebrate it with us</p>
</div>

<footer>A &amp; N &nbsp;·&nbsp; Engagement</footer>

<script>
  (function(){
    var target = new Date(2026, 10, 5, 18, 0, 0).getTime(); // Nov 5, 2026, 6:00 PM

    var daysEl = document.getElementById('days');
    var hoursEl = document.getElementById('hours');
    var minutesEl = document.getElementById('minutes');
    var secondsEl = document.getElementById('seconds');
    var activeWrap = document.getElementById('countdown-active');
    var arrivedMsg = document.getElementById('arrived-message');

    function pad(n){ return String(n).padStart(2, '0'); }

    function tick(){
      var now = new Date().getTime();
      var diff = target - now;

      if(diff <= 0){
        activeWrap.style.display = 'none';
        arrivedMsg.style.display = 'block';
        clearInterval(interval);
        return;
      }

      var days = Math.floor(diff / (1000 * 60 * 60 * 24));
      var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    tick();
    var interval = setInterval(tick, 1000);

    // Gently floating petals for a softer, more romantic backdrop
    var petalContainer = document.getElementById('petals');
    var petalCount = 14;
    for(var i = 0; i < petalCount; i++){
      var petal = document.createElement('div');
      petal.className = 'petal' + (i % 3 === 0 ? ' gold' : '');
      var left = Math.random() * 100;
      var duration = 14 + Math.random() * 12;
      var delay = Math.random() * 18;
      var scale = 0.7 + Math.random() * 0.9;
      petal.style.left = left + '%';
      petal.style.animationDuration = duration + 's';
      petal.style.animationDelay = '-' + delay + 's';
      petal.style.transform = 'scale(' + scale + ')';
      petalContainer.appendChild(petal);
    }
  })();
</script>

</body>
</html>
